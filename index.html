<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Descargas y Respuestas Rápidas</title>
    <style>
        :root {
            --bg: #020817;
            --panel: #111827;
            --panel-alt: #0f172a;
            --border: #334155;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --accent-strong: #0ea5e9;
            --shadow: rgba(14, 165, 233, 0.25);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: radial-gradient(circle at top, #0f172a 0%, var(--bg) 60%);
            color: var(--text);
            padding: 32px 20px;
        }

        main {
            width: min(100%, 680px);
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 18px 40px var(--shadow);
            padding: 32px 24px;
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 4vw, 2.6rem);
            line-height: 1.2;
        }

        p {
            margin: 0 0 28px;
            color: var(--muted);
            font-size: 1.05rem;
        }

        .grid {
            display: grid;
            gap: 14px;
        }

        a {
            display: block;
            padding: 18px 20px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--panel) 0%, var(--panel-alt) 100%);
            color: var(--accent);
            border: 1px solid var(--border);
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.4);
        }

        a:hover,
        a:focus-visible {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-color: var(--accent);
            box-shadow: 0 12px 24px rgba(56, 189, 248, 0.2);
            transform: translateY(-1px);
        }

        @media (max-width: 480px) {
            main {
                padding: 24px 16px;
            }

            a {
                padding: 16px 14px;
                font-size: 0.96rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Plataforma de Utilidades e Información Básica</h1>
        <p>Selecciona el portal al que deseas acceder:</p>

        <nav class="grid" aria-label="Portales principales">
            <a href="solucion-acertijo-android-hoy.html">Portal 1: Solución de Acertijos Diarios</a>
            <a href="descargar-driver-controlador-antiguo.html">Portal 2: Descarga de Controladores Antiguos</a>
            <a href="trucos-escondidos-playstation-kd2.html">Portal 3: Trucos Kingdom Come Deliverance 2</a>
        </nav>
    </main>
</body>
</html>
